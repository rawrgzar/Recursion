version: 0.1
words:
  - word: site
    context: Recursion site declaration
  - word: theme
    context: Site theme property
  - word: layout
    context: Site or page layout property
  - word: hero
    context: Hero block
  - word: title
    context: Page or hero title property
  - word: subtitle
    context: Hero subtitle property
  - word: button
    context: Hero action label property
  - word: section
    context: Section declaration
  - word: card
    context: Card declaration inside a section
  - word: page
    context: Normalized YAML page title key
  - word: max_width
    context: Maximum pixel width for a wide site shell
  - word: style
    context: Optional visual design settings block
  - word: background
    context: Page background color design token
  - word: surface
    context: Card and panel background color design token
  - word: text
    context: Primary text color design token
  - word: muted
    context: Secondary text color design token
  - word: accent
    context: Primary action and decorative color design token
  - word: accent_text
    context: Text color used on the accent color
  - word: hero_start
    context: Start color for the hero panel gradient
  - word: hero_end
    context: End color for the hero panel gradient
  - word: radius
    context: Corner radius for hero and cards
  - word: navbar
    context: Responsive top navigation block
  - word: brand
    context: Navbar brand label
  - word: items
    context: Navbar menu item list
  - word: label
    context: Navbar menu item text
  - word: href
    context: In-page anchor for a navbar menu item
  - word: print
    context: Cold-start smoke statement
  - word: report
    context: Generic report document declaration
  - word: nav
    context: Report navigation block
  - word: link
    context: In-page report navigation item
  - word: heading
    context: Editorial report heading block
  - word: eyebrow
    context: Small uppercase heading label
  - word: meta
    context: Contextual report metadata
  - word: feature
    context: Prominent report summary block
  - word: metrics
    context: Report metric group
  - word: metric
    context: One labeled report value and note
  - word: table
    context: Report data table
  - word: column
    context: Report table column heading
  - word: row
    context: Report table data row
  - word: activity
    context: Chronological report activity list
  - word: event
    context: One report activity entry
  - word: footer
    context: Report footer block
  - word: callout
    context: Report interpretation or source caveat
  - word: chart
    context: Quantitative comparison visualization
  - word: series
    context: Named chart data series and palette token
  - word: point
    context: Labeled chart values for each series
  - word: detail
    context: Expandable context for a report table row
  - word: search
    context: Search placeholder for an interactive report table
  - word: filter
    context: Table column used to build a value filter
  - word: page_size
    context: Number of report table rows shown per page
  - word: professions
    context: Optional group of profession-specific leveling tabs
  - word: profession
    context: Profession tab declaration with type and overview
  - word: step
    context: One skill-range recipe or gathering step within a profession tab
