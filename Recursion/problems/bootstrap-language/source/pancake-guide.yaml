cards_heading: Small details. Softer pancakes.
cards:
  - title: Mix with a light hand
    text: Stir the wet and dry ingredients just until combined. A few small lumps are fine; overmixing can make pancakes tougher.
  - title: Give the pan a moment
    text: Use a lightly greased pan over steady medium heat. If the outside colors before the middle cooks, lower the heat a little.
  - title: Watch for the flip
    text: Turn the pancake when bubbles appear across the surface and the edges begin to look set. Cook the second side until golden.
feature:
  id: styles
  title: One name. Many traditions.
  text: Pancakes are a broad family of quick-cooking batters and griddle cakes. Some are thin and flexible, like English pancakes and crêpes; others rise into a thicker, airy stack. Ingredients and toppings shift with local kitchens and tastes.
  image: ../assets/english-pancakes.jpg
  image_alt: A thin English-style pancake served folded on a plate
