<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakfast Blaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body data-theme="arcade" class="theme-arcade">
  <main class="container text-center py-4 py-lg-5">
    <header class="py-4 py-md-5">
      <h1 class="display-5 fw-bold mb-3">Ready for breakfast?</h1>
      <p class="lead mb-4">Build. Discover. Repeat.</p>
      <button type="button" class="btn btn-primary btn-lg">Start Exploring</button>
    </header>
    <section class="py-4" aria-labelledby="section-1">
      <h2 id="section-1" class="h3 mb-3">How it works</h2>
      <div class="row row-cols-1 row-cols-md-3 g-3">
        <div class="col"><article class="card h-100"><div class="card-body"><h3 class="h5 card-title">Discover</h3></div></article></div>
        <div class="col"><article class="card h-100"><div class="card-body"><h3 class="h5 card-title">Collaborate</h3></div></article></div>
        <div class="col"><article class="card h-100"><div class="card-body"><h3 class="h5 card-title">Contribute</h3></div></article></div>
      </div>
    </section>
  </main>
</body>
</html>
